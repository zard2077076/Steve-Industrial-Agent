name: Alpha CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
      - name: Privacy and history scan
        shell: pwsh
        run: ./scripts/Test-ReleasePrivacy.ps1
      - name: Clean JVM and Forge build
        shell: pwsh
        run: gradle --no-daemon clean build
      - name: Loader-neutral boundary
        shell: pwsh
        run: |
          $hits = rg -n 'net\.minecraft|net\.minecraftforge|com\.simibubi' core/src/main adapter-api/src/main
          if ($LASTEXITCODE -eq 0) { throw "Loader-specific import in pure module: $hits" }
      - name: Release artifact checks
        shell: pwsh
        run: |
          ./scripts/Test-DistributionBoundary.ps1
          ./scripts/Test-ReleaseVersion.ps1
          $jar = Get-Item forge-create-1.20.1/build/libs/steve-industrial-agent-0.1.0-alpha.1.jar
          (Get-FileHash $jar.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $jar.Name | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: steve-industrial-agent-0.1.0-alpha.1-ci
          path: |
            forge-create-1.20.1/build/libs/steve-industrial-agent-0.1.0-alpha.1.jar
            SHA256SUMS.txt
          if-no-files-found: error
