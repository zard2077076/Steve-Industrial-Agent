repositories {
    maven { url = rootProject.file('work/local-maven') }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(':core')
    implementation project(':adapter-api')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    // Direct Create references compile only inside internal/v606. Runtime profiles still decide
    // whether any Create classes or supporting libraries are present when the game launches.
    compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) {
        transitive = false
    }
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")
    // Final official IE 1.20.1 build. Kept optional and unbundled; versioned internals live in
    // adapter/immersiveengineering/internal/v1020 only.
    compileOnly fg.deobf("curse.maven:immersive-engineering-231951:${immersive_engineering_curse_file}")

    // The dedicated IE acceptance switch is self-contained: it must not be possible to
    // compile the fixture and then accidentally launch it without IE on the runtime path.
    if (project.hasProperty('ieAdapterAcceptance')
            || project.hasProperty('iePhysicalAcceptance')
            || metalPressResourceRecoveryReloadPhase != null
            || alloySmelterRecoveryReloadAcceptancePhase != null
            || alloySmelterWarehouseRestartPhase != null
            || ipo03ResourceRestartPhase != null
            || providers.gradleProperty('includeImmersiveEngineeringRuntime')
                    .map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly fg.deobf("curse.maven:immersive-engineering-231951:${immersive_engineering_curse_file}")
    }

    if (includeCreateRuntime) {
        runtimeOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) {
            transitive = false
        }
        runtimeOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        runtimeOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
        runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        release_version: project.version,
        git_commit: rootProject.ext.releaseGitCommit,
        build_timestamp: rootProject.ext.releaseGitTimestamp,
        target_runtime_forge_version: target_runtime_forge_version,
        dirty_worktree: rootProject.ext.releaseDirty
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta',
                   'steve-industrial-agent-release.properties']) {
        expand replacements + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':core').sourceSets.main.output
    from project(':adapter-api').sourceSets.main.output
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-steve-industrial-agent' }
    }
    from(rootProject.file('NOTICE')) {
        into 'META-INF'
        rename { 'NOTICE-steve-industrial-agent' }
    }
    manifest {
        attributes([
            'Specification-Title': 'Steve Industrial Agent',
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': 'Steve Industrial Agent',
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'Git-Commit': rootProject.ext.releaseGitCommit,
            'Build-Timestamp': rootProject.ext.releaseGitTimestamp,
            'Minecraft-Version': minecraft_version,
            'Forge-Version': target_runtime_forge_version,
            'Create-Compatibility': '6.0.6',
            'Dirty-Worktree': rootProject.ext.releaseDirty.toString(),
            'Reproducible-Build': 'deterministic-jar-order-and-timestamps'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    from project(':core').sourceSets.main.allSource
    from project(':adapter-api').sourceSets.main.allSource
}

tasks.matching { it.name == 'runServer' }.configureEach {
    def ieAcceptanceStartedAt = [millis: 0L]
    def iePhysicalAcceptanceStartedAt = [millis: 0L]
    def metalPressReloadStartedAt = [millis: 0L]
    def metalPressResourceReloadStartedAt = [millis: 0L]
    def alloyReloadStartedAt = [millis: 0L]
    def alloyWarehouseRestartStartedAt = [millis: 0L]
    doFirst {
        if (project.hasProperty('ieAdapterAcceptance')) {
            def eula = project.file('run/ie-v1020-adapter-acceptance/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            ieAcceptanceStartedAt.millis = System.currentTimeMillis()
        }
        if (project.hasProperty('iePhysicalAcceptance')) {
            def eula = project.file('run/ie-v1020-physical-acceptance/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            iePhysicalAcceptanceStartedAt.millis = System.currentTimeMillis()
        }
        if (metalPressRecoveryReloadAcceptancePhase != null) {
            def eula = project.file('run/ie-metal-press-recovery-reload-acceptance/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            metalPressReloadStartedAt.millis = System.currentTimeMillis()
        }
        if (metalPressResourceRecoveryReloadPhase != null) {
            def pressResourceWindow = metalPressResourceReloadParts.size() == 1
                    ? 'power-verified'
                    : metalPressResourceReloadParts[1].toLowerCase().replace('_', '-')
            def eula = project.file(
                    'run/ie-metal-press-resource-recovery-' + pressResourceWindow + '/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            metalPressResourceReloadStartedAt.millis = System.currentTimeMillis()
        }
        if (alloySmelterRecoveryReloadAcceptancePhase != null) {
            def runDir = project.file('run/ie-alloy-smelter-recovery-'
                    + alloyReloadParts[1].toLowerCase().replace('_', '-'))
            def eula = new File(runDir, 'eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            alloyReloadStartedAt.millis = System.currentTimeMillis()
        }
        if (alloySmelterWarehouseRestartPhase != null) {
            def eula = project.file('run/ie-alloy-warehouse-restart/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
            alloyWarehouseRestartStartedAt.millis = System.currentTimeMillis()
        }
        if (ipo03ResourceRestartPhase != null) {
            def eula = project.file('run/ipo03-resource-restart/eula.txt')
            eula.parentFile.mkdirs()
            eula.setText('eula=true\n', 'UTF-8')
        }
    }
    doLast {
        if (project.hasProperty('ieAdapterAcceptance')) {
            def runDir = project.file('run/ie-v1020-adapter-acceptance')
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = 'IE_V1020_ADAPTER_ACCEPTANCE PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException(
                        "IE adapter acceptance did not emit '${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll { it.lastModified() >= ieAcceptanceStartedAt.millis }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE adapter acceptance created crash report(s): ${newCrashes}")
            }
        }
        if (project.hasProperty('iePhysicalAcceptance')) {
            def runDir = project.file('run/ie-v1020-physical-acceptance')
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = 'IE_V1020_PHYSICAL_ACCEPTANCE PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException(
                        "IE physical acceptance did not emit '${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll { it.lastModified() >= iePhysicalAcceptanceStartedAt.millis }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE physical acceptance created crash report(s): ${newCrashes}")
            }
        }
        if (metalPressRecoveryReloadAcceptancePhase != null) {
            def runDir = project.file('run/ie-metal-press-recovery-reload-acceptance')
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = metalPressRecoveryReloadAcceptancePhase == 'write'
                    ? 'IE_METAL_PRESS_RECOVERY_RELOAD_WRITE PASS'
                    : 'IE_METAL_PRESS_RECOVERY_RELOAD_ACCEPTANCE PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException(
                        "IE Metal Press reload acceptance did not emit '${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll { it.lastModified() >= metalPressReloadStartedAt.millis }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE Metal Press reload acceptance created crash report(s): ${newCrashes}")
            }
        }
        if (metalPressResourceRecoveryReloadPhase != null) {
            def pressResourceWindow = metalPressResourceReloadParts.size() == 1
                    ? 'power-verified'
                    : metalPressResourceReloadParts[1].toLowerCase().replace('_', '-')
            def runDir = project.file('run/ie-metal-press-resource-recovery-'
                    + pressResourceWindow)
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = metalPressResourceReloadParts[0] == 'write'
                    ? 'IE_METAL_PRESS_RESOURCE_RELOAD_WRITE PASS'
                    : metalPressResourceReloadParts[0] == 'approve'
                            ? 'IE_METAL_PRESS_MAINTENANCE_RELOAD_APPROVE PASS'
                            : 'IE_METAL_PRESS_RESOURCE_RELOAD_ACCEPTANCE PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException("IE Metal Press resource reload did not emit "
                        + "'${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll {
                it.lastModified() >= metalPressResourceReloadStartedAt.millis
            }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE Metal Press resource reload created crash report(s): ${newCrashes}")
            }
        }
        if (alloySmelterRecoveryReloadAcceptancePhase != null) {
            def runDir = project.file('run/ie-alloy-smelter-recovery-'
                    + alloyReloadParts[1].toLowerCase().replace('_', '-'))
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = alloyReloadParts[0] == 'write'
                    ? 'IE_ALLOY_RECOVERY_RELOAD_WRITE PASS'
                    : 'IE_ALLOY_RECOVERY_RELOAD_ACCEPTANCE PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException(
                        "IE Alloy reload acceptance did not emit '${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll { it.lastModified() >= alloyReloadStartedAt.millis }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE Alloy reload acceptance created crash report(s): ${newCrashes}")
            }
        }
        if (alloySmelterWarehouseRestartPhase != null) {
            def runDir = project.file('run/ie-alloy-warehouse-restart')
            def latestLog = new File(runDir, 'logs/latest.log')
            def passMarker = alloySmelterWarehouseRestartPhase == 'write'
                    ? 'IE_ALLOY_WAREHOUSE_RESTART_WRITE PASS'
                    : 'IE_ALLOY_WAREHOUSE_RESTART_READ PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException("IE Alloy warehouse restart did not emit "
                        + "'${passMarker}' in ${latestLog}")
            }
            def newCrashes = fileTree(new File(runDir, 'crash-reports')).matching {
                include '*.txt'
            }.files.findAll { it.lastModified() >= alloyWarehouseRestartStartedAt.millis }
            if (!newCrashes.isEmpty()) {
                throw new GradleException(
                        "IE Alloy warehouse restart created crash report(s): ${newCrashes}")
            }
        }
        if (ipo03ResourceRestartPhase != null) {
            def latestLog = project.file('run/ipo03-resource-restart/logs/latest.log')
            def passMarker = ipo03ResourceRestartPhase == 'write'
                    ? 'IPO03_RESOURCE_RESTART_WRITE PASS'
                    : 'IPO03_RESOURCE_RESTART_READ PASS'
            if (!latestLog.isFile() || !latestLog.getText('UTF-8').contains(passMarker)) {
                throw new GradleException("IPO-03 resource restart did not emit "
                        + "'${passMarker}' in ${latestLog}")
            }
        }
    }
}
