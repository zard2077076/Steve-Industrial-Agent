plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

base {
    archivesName = 'steve-industrial-agent'
}

// Create 6.0.6 asks Mixin to resolve its optional JourneyMap target even when
// JourneyMap is absent. This run-only source set supplies only that target name
// for create-only-client startup scanning. The target is never loaded by the
// profile and is never part of the production binary or sources JAR.
sourceSets {
    createOnlyClientAcceptance
    // A second Forge mod loaded only by the external player-acceptance launcher.
    // Its localhost control surface is not compiled into the production JAR.
    clientAcceptanceHarness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    clientAcceptanceHarnessImplementation.extendsFrom implementation
    clientAcceptanceHarnessCompileOnly.extendsFrom compileOnly
    clientAcceptanceHarnessRuntimeOnly.extendsFrom runtimeOnly
}

def clientAcceptanceHarnessEnabled = providers
        .gradleProperty('clientAcceptanceHarness')
        .map { it.toBoolean() }
        .getOrElse(false)
if (clientAcceptanceHarnessEnabled) {
    ['playerAcceptanceRoot', 'clientAcceptanceHarnessTokenFile',
     'clientAcceptanceHarnessEndpoint', 'clientAcceptanceHarnessWorld'].each { propertyName ->
        if (!project.hasProperty(propertyName)) {
            throw new GradleException("clientAcceptanceHarness requires -P${propertyName}")
        }
    }
    if (project.property('clientAcceptanceHarnessWorld') != 'Steve Agent Mac Acceptance') {
        throw new GradleException(
                'clientAcceptanceHarnessWorld must be exactly Steve Agent Mac Acceptance')
    }
}

