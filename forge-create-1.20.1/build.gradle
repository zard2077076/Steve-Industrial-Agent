// Windows acceptance uses the real launcher root as its explicit forbidden
// boundary. Other hosts have no PCL2 root, so use an existing repository-
// ignored sentinel outside every isolated run directory. The runtime guards
// still canonicalize both paths and fail closed; this only prevents a Windows
// drive path from becoming an unresolved relative path on Unix-like hosts.
def windowsHost = System.getProperty('os.name')
        .toLowerCase(Locale.ROOT)
        .startsWith('windows')
def acceptanceForbiddenRoot = windowsHost
        ? new File('D:/PCL2')
        : rootProject.file('work/non-windows-formal-root-sentinel')
def acceptanceForbiddenRootIdentity = acceptanceForbiddenRoot.absolutePath
tasks.matching { task ->
    !windowsHost && task.name in ['runClient', 'runServer', 'runGameTestServer']
}.configureEach {
    doFirst {
        if (!acceptanceForbiddenRoot.isDirectory()
                && !acceptanceForbiddenRoot.mkdirs()) {
            throw new GradleException(
                    "Could not create non-Windows forbidden-root sentinel: "
                            + acceptanceForbiddenRoot)
        }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    project.layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                steve_create_agent {
                    source sourceSets.main
                    source project(':core').sourceSets.main
                    source project(':adapter-api').sourceSets.main
                    if (runtimeProfile == 'create-only-client') {
                        source sourceSets.createOnlyClientAcceptance
                    }
                }
                if (clientAcceptanceHarnessEnabled) {
                    steve_acceptance_bridge {
                        source sourceSets.clientAcceptanceHarness
                    }
                }
            }
        }

        client {
            if (runtimeProfile.endsWith('-client')) {
                workingDirectory project.file("run/profiles/${runtimeProfile}")
                property 'steve_industrial.test.runtimeProfile', runtimeProfile
            }
            // A game directory outside the repository, for player acceptance.
            //
            // The runtime refuses to build in a world whose game directory has a git
            // ancestor (SOURCE_TREE_GAME_DIR_REFUSED), which is deliberate: construction
            // writes region files, and a source tree is the last place they belong. That
            // refusal is about where the directory is, not about runClient, so the fix is
            // to move the directory rather than to weaken the check. The development
            // client keeps its in-repository default and stays unable to build; this
            // switch is what a player uses, and it needs no Minecraft licence because
            // ForgeGradle supplies a development account.
            if (project.hasProperty('playerAcceptanceRoot')) {
                def acceptanceRoot = project.file(project.property('playerAcceptanceRoot'))
                def repositoryRoot = rootProject.projectDir.canonicalFile.toPath()
                if (acceptanceRoot.canonicalFile.toPath().startsWith(repositoryRoot)) {
                    throw new GradleException("playerAcceptanceRoot must be outside the "
                            + "repository, or the runtime will refuse it for the same "
                            + "reason the default run directory is refused: "
                            + acceptanceRoot)
                }
                workingDirectory acceptanceRoot
            }
            if (clientAcceptanceHarnessEnabled) {
                def acceptanceRoot = project.file(project.property('playerAcceptanceRoot'))
                        .canonicalFile
                def endpoint = project.file(project.property('clientAcceptanceHarnessEndpoint'))
                        .canonicalFile
                def expectedEndpoint = new File(acceptanceRoot,
                        '.steve-agent-harness/bridge.json').canonicalFile
                if (endpoint != expectedEndpoint) {
                    throw new GradleException('clientAcceptanceHarnessEndpoint must be exactly '
                            + expectedEndpoint)
                }
                def tokenFile = project.file(
                        project.property('clientAcceptanceHarnessTokenFile')).canonicalFile
                def expectedTokenFile = new File(acceptanceRoot,
                        '.steve-agent-harness/bridge-token').canonicalFile
                if (tokenFile != expectedTokenFile || !tokenFile.isFile()) {
                    throw new GradleException('clientAcceptanceHarnessTokenFile must be exactly '
                            + expectedTokenFile)
                }
                property 'steve_industrial.acceptance.bridge.enabled', 'true'
                property 'steve_industrial.acceptance.bridge.tokenFile',
                        tokenFile.absolutePath
                property 'steve_industrial.acceptance.bridge.endpoint', endpoint.absolutePath
                property 'steve_industrial.acceptance.bridge.gameRoot', acceptanceRoot.absolutePath
                property 'steve_industrial.acceptance.bridge.world',
                        project.property('clientAcceptanceHarnessWorld')
                property 'steve_industrial.acceptance.bridge.port',
                        project.findProperty('clientAcceptanceHarnessPort') ?: '0'
                // Composite reuses the isolated three-mode executor.  Keep that authority
                // inside the already authenticated, disposable real-client harness; normal
                // clients and the production JAR never receive this runtime property.
                property 'steve_industrial.test.goalDrivenExecutionGameTest', 'true'
                def quickPlayWorld = project.findProperty('clientAcceptanceQuickPlayWorld')
                if (quickPlayWorld != null && !quickPlayWorld.toString().isBlank()) {
                    if (quickPlayWorld != project.property('clientAcceptanceHarnessWorld')) {
                        throw new GradleException('Quick-play world must equal the acceptance world')
                    }
                    args '--quickPlaySingleplayer', quickPlayWorld
                }
            }
        }
        server {
            args '--nogui'
            if (project.hasProperty('ieAdapterAcceptance')) {
                def ieRunDir = project.file('run/ie-v1020-adapter-acceptance')
                workingDirectory ieRunDir
                property 'steve_industrial.test.ieAdapterAcceptance', 'true'
            }
            if (project.hasProperty('iePhysicalAcceptance')) {
                def iePhysicalRunDir = project.file('run/ie-v1020-physical-acceptance')
                workingDirectory iePhysicalRunDir
                property 'steve_industrial.test.iePhysicalAcceptance', 'true'
            }
            // IPO-02: the Composite order gate needs Create only; it starts from the
            // player service, so it must not share a run directory with any fixture
            // that seeds its own arena.
            // The reload gate shares the Composite order's executor gating but keeps its
            // own run directory, because its two phases must reuse one saved world.
            if (compositePlayerOrderReloadPhase != null) {
                def compositeReloadRunDir = project.file('run/composite-player-order-reload')
                workingDirectory compositeReloadRunDir
                property 'steve_industrial.test.compositePlayerOrderReloadPhase',
