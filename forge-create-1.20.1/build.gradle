                property 'steve_industrial.test.botFleetGameTest', 'true'
                property 'steve_industrial.execution.expectedGameDir',
                        compositeReloadRunDir.absolutePath
                property 'steve_industrial.execution.forbiddenRoot',
                        acceptanceForbiddenRootIdentity
                property 'steve_industrial.bot.expectedGameDir', compositeReloadRunDir.absolutePath
                property 'steve_industrial.bot.forbiddenRoot', acceptanceForbiddenRootIdentity
            }
            // Resuming needs its own saved world for the same reason the reload gate
